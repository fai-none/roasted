name: Roasted
options:
  bundleIdPrefix: dev.roasted
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
targets:
  Roasted:
    type: application
    platform: iOS
    sources:
      - path: Roasted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.roasted.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Roasted
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Talk with Nobody in real time. Your voice is sent to Higgs for this call."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connect securely to your Mac's Roasted demo backend for call access and learner memory."
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - RoastedTests
  RoastedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Roasted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.roasted.demo.tests
        GENERATE_INFOPLIST_FILE: YES
